<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento de consultas - Clinica Bem Viver</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>Agendamento de Consultas</h1>
            <p>Preencha o formulario abaixo para agendar sua consulta médica</p>
        </header>
        <main>
            <form action="" id="formulario-agendamento">
                <div class="form-group">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>
                <div class="form-group">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" name="telefone" id="telefone" required>
                </div>
                <div class="form-group">
                    <label for="data">Data da consulta</label>
                    <input type="date" name="data" id="data" required>
                </div>
                <div class="form-group">
                    <label for="horario">Horário disponivel:</label>
                    <select name="horario" id="horario" required>
                        <option value="">Selecione uma data primeiro</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="especialidade">Especialidade:</label>
                    <select name="especialidade" id="especialidade" required>
                        <option value="">Selecione uma especialidade</option>
                        <option value="Clínico Geral">Clínico Geral</option>
                        <option value="Cardiologista">Cardiologista</option>
                        <option value="Dermatologista">Dermatologista</option>
                        <option value="Oftalmologista">Oftalmologista</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="plano">Plano de Saude:</label>
                    <select name="plano" id="plano">
                        <option value="">Selecione seu plano</option>
                        <option value="Particular">Particular</option>
                        <option value="Unimed">Unimed</option>
                        <option value="Amil">Amil</option>
                        <option value="Qualicorp">Qualicorp</option>
                        <option value="HapVida">HapVida</option>
                    </select>
                </div>
                <div class="form-group">
                    <button type="submit" id="button-agendar">Confirmar Agendamento</button>
                </div>
            </form>
            <div id="confirmacao" class="hidden">
                <h2>Consulta agendada com sucesso!</h2>
                <div id="resumo-agendamento">
                    <!-- Resumo será anexado aqui -->
                     <button id="novo-agendamento">Fazer novo agendamento</button>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
